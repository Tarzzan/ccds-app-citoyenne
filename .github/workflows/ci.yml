name: CI — Tests & Linting

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────
  # Job 1 : Tests PHPUnit (backend)
  # ─────────────────────────────────────────────
  test-backend:
    name: PHPUnit Tests
    runs-on: ubuntu-22.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ma_commune_test
          MYSQL_USER: ma_commune_user
          MYSQL_PASSWORD: ma_commune_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_mysql, mbstring, json, openssl
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --working-dir=backend

      - name: Run database migrations (Phinx)
        run: |
          cd backend
          vendor/bin/phinx migrate -e testing
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: ma_commune_test
          DB_USER: ma_commune_user
          DB_PASS: ma_commune_pass

      - name: Run PHPUnit tests
        run: |
          cd backend
          vendor/bin/phpunit --configuration phpunit.xml --coverage-text
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: ma_commune_test
          DB_USER: ma_commune_user
          DB_PASS: ma_commune_pass
          JWT_SECRET: test_secret_key_ci

  # ─────────────────────────────────────────────
  # Job 2 : Linting PHP (PHP-CS-Fixer)
  # ─────────────────────────────────────────────
  lint-backend:
    name: PHP Code Style (PHP-CS-Fixer)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --working-dir=backend

      - name: Run PHP-CS-Fixer (dry-run)
        run: |
          cd backend
          vendor/bin/php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.php

  # ─────────────────────────────────────────────
  # Job 3 : Vérification TypeScript (mobile)
  # ─────────────────────────────────────────────
  typecheck-mobile:
    name: TypeScript Type Check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        working-directory: mobile
        run: pnpm run typecheck
