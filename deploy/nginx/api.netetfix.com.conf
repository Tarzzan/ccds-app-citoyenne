server {
    listen 80;
    server_name api.netetfix.com;

    root /home/ubuntu/ma-commune;

    location = / {
        return 302 /api-docs/;
    }

    location = /status {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /home/ubuntu/ma-commune/backend/status.php;
        include fastcgi_params;
    }

    location /api-docs/ {
        alias /home/ubuntu/ma-commune/backend/public/api-docs/;
        index index.html;
        try_files $uri $uri/ /api-docs/index.html;
    }

    location = /api/openapi.yml {
        alias /home/ubuntu/ma-commune/backend/public/api-docs/openapi.yml;
    }

    location = /api/openapi.yaml {
        alias /home/ubuntu/ma-commune/backend/public/api-docs/openapi.yaml;
    }

    location ^~ /uploads/ {
        alias /home/ubuntu/ma-commune/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ^~ /api/ {
        try_files $uri /backend/index.php?$query_string;
    }

    location = /backend/index.php {
        internal;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /home/ubuntu/ma-commune/backend/index.php;
        include fastcgi_params;
    }

    location ~ \.php$ {
        return 404;
    }

    location / {
        return 404;
    }
}
