server {
    listen 80;
    server_name www.netetfix.com;
    return 301 https://netetfix.com$request_uri;
}

server {
    listen 80;
    server_name netetfix.com;
    return 301 https://netetfix.com$request_uri;
}

server {
    listen 443 ssl;
    server_name netetfix.com www.netetfix.com;

    ssl_certificate /etc/letsencrypt/live/netetfix.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netetfix.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.netetfix.com) {
        return 301 https://netetfix.com$request_uri;
    }

    root /home/ubuntu/ma-commune/site;
    index index.html;

    location = /webhook {
        proxy_pass http://localhost:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /admin/ {
        return 301 https://admin.netetfix.com$request_uri;
    }

    location ~ ^/mc-api/?(.*)$ {
        return 301 https://api.netetfix.com/api/$1$is_args$args;
    }

    location ^~ /app/ {
        return 301 https://admin.netetfix.com/admin/?page=login;
    }

    location ^~ /mc-uploads/ {
        alias /home/ubuntu/ma-commune/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
