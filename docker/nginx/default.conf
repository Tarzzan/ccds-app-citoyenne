server {
    listen 80;
    server_name localhost;

    # ── Statut public ────────────────────────────────────────
    location = /status {
        include        fastcgi_params;
        fastcgi_pass   php:9000;
        fastcgi_param  SCRIPT_FILENAME /var/www/backend/status.php;
        fastcgi_param  SCRIPT_NAME     /status;
        fastcgi_param  REQUEST_URI     $request_uri;
    }

    # ── Documentation API publique ───────────────────────────
    location = /api/openapi.yml {
        alias /var/www/backend/public/api-docs/openapi.yml;
        default_type application/yaml;
    }

    location /api-docs/ {
        alias /var/www/backend/public/api-docs/;
        index index.html;
        try_files $uri $uri/ /api-docs/index.html;
    }

    # ── API Backend ──────────────────────────────────────────
    location /api/ {
        include        fastcgi_params;
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME /var/www/backend/index.php;
        fastcgi_param  SCRIPT_NAME     /index.php;
        fastcgi_param  PATH_INFO       $uri;
        fastcgi_param  REQUEST_URI     $request_uri;
    }

    # ── Uploads (fichiers statiques) ─────────────────────────
    location /uploads/ {
        alias /var/www/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Back-Office Admin ────────────────────────────────────
    location /admin/ {
        root /var/www;
        index index.php;
        try_files $uri $uri/ /admin/index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass   php:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME /var/www$fastcgi_script_name;
            include        fastcgi_params;
        }
    }

    # ── Sécurité ─────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Bloquer l'accès aux fichiers sensibles
    location ~ /\.(env|git|htaccess) {
        deny all;
    }

    location ~ /(vendor|tests|docker)/ {
        deny all;
    }

    client_max_body_size 25M;
}
