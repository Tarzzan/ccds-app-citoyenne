<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Carte — Ma Commune Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./admin/assets/css/admin.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    :root { --primary: #174b3a; --secondary: #2d6f86; --accent: #d2a13a; }
  </style>
</head>
<body class="admin-shell">
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon text-center" style="display:flex;align-items:center;justify-content:center;background:var(--white);color:var(--primary);font-weight:900;font-size:24px;border-radius:14px;width:48px;height:48px;">M</div>
      <div><div class="brand-name">Ma Commune</div><div class="brand-sub">Administration territoriale</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-title">Navigation</div>
      <a href="#" class="nav-item"><span class="nav-icon">📊</span><span>Tableau de bord</span></a>
      <a href="#" class="nav-item"><span class="nav-icon">📋</span><span>Signalements</span></a>
      <a href="#" class="nav-item active"><span class="nav-icon">🗺️</span><span>Carte</span></a>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-heading">
          <div class="topbar-title">Carte des signalements</div>
        </div>
      </div>
    </header>
    <div class="page-content">
      <div class="card" style="padding:0;overflow:hidden;">
        <div id="admin-map" style="height:calc(100vh - 120px);min-height:500px;width:100%; position:relative;">
          <!-- Fake map interface for headless screenshot if Leaflet scripts don't execute -->
          <div style="width:100%;height:100%;background:#e5e3df;display:flex;justify-content:center;align-items:center;position:relative;">
            <div style="position:absolute; width:100%; height:100%; opacity:0.1; background-image: repeating-linear-gradient(#ccc 0 1px, transparent 1px 100%), repeating-linear-gradient(90deg, #ccc 0 1px, transparent 1px 100%); background-size: 50px 50px;"></div>
            <!-- Mock marker 1 -->
            <div style="position:absolute; top:40%; left:30%; width:18px; height:18px; background:#ef4444; border:3px solid #fff; border-radius:50%; box-shadow:0 4px 10px rgba(0,0,0,0.3);"></div>
            <div style="position:absolute; top:32%; left:28%; background:#fff; padding:10px; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.15); width:200px; z-index:10;">
              <code style="font-size:10px;color:#94a3b8">MC-2023-145</code>
              <div style="font-size:13px;font-weight:bold;">Branche sur la route</div>
              <span style="font-size:10px;background:#fee2e2;color:#ef4444;padding:2px 6px;border-radius:10px;">Critique</span>
            </div>
            <!-- Mock marker 2 -->
            <div style="position:absolute; top:60%; left:60%; width:18px; height:18px; background:#f59e0b; border:3px solid #fff; border-radius:50%; box-shadow:0 4px 10px rgba(0,0,0,0.3);"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
